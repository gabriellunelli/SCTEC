<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de desconto</title>

    <script src="script.js"></script>
</head>
<body>
    <h1>Calculadora de desconto</h1>
    <p>Você deve fornecer o preço original do produto em um campo, e o valor do desconto em outro.</p>
    <label>Preço do produto: </label>
    <input type="number" id="preco" required />
    <label>Valor do desconto (em porcentagem): </label>
    <input type="number" id="desconto" required />
    <button onclick="calcularDesconto()">Calcular preço com desconto</button>

    <p>valor final com o desconto:</p>
    <p id="resultado"></p>
</body>
</html>
