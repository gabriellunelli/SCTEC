<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"></script>
    <style>
        label, button {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Saudação personalizada</h1>
    <label for="nome">Digite seu nome:</label>
    <input type="text" id="nome">
    <label for="hora">Determine um período</label>
    <select name="hora" id="hora">
        <option value="">Selecione</option>
        <option value="7">Manhã (7hrs)</option>
        <option value="12">Tarde (12hrs)</option>
        <option value="18">Noite (18hrs)</option>
    </select>
    <button onclick="mostraSaudacao()">Mostrar saudação</button>
    <p id="mensagem"></p>
</body>
</html>
